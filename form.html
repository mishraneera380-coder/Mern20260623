<!DOCTYPE html>
<html>
    <head>
        <title>Form HTML</title>
        <link rel="stylesheet" href="form.css">
        
    </head>
    <body>
        <form action="">
        <center>
            <h1><strong>Form page</strong></h1></center>
            <div>
                <label for="Name" >Name</label>
           <input type="text" id="Name" required placeholder="Your full name">
        
            </div>
            
            <div>
                <label for="Email"> Email </label>
            <input type="email" id="Email" required placeholder="Alex123@gmail.com" requireed
            >

            </div>
            
            
            <div>
                <label for="password">Password</label>
                            <input type="password" id="Password " required>

            </div>
            



            <div>
                <label for="Number ">Number</label>
                            <input type="number" id="Number"  name=Number value="+977">

            </div>

            <div>
                <label for="date">Date</label>
                <input type="date"id="date"/>
            </div>
            
            <div>
                <label for="time">Time</label>
                <input type="time"id="time"/>
            </div>
                       
            <div>
                <label for="datetime">Date</label>
                <input type="datetime-local"id="datetime"/>
            </div>

            <div>
                <label for="file">File</label>
                <input type="file"id="file"/>
            </div>          

            <div>
                <label for="range"> Range</label>
                <input type="range" id="range"/>
            </div>

            <div >
             <label for="">Gender:</label>
             <input type="radio" name="Gender" value="male" checked id="male"/>
             <label for="male">Male</label>
             <input type="radio" name="Gender" value="female" checked id="female"/>
             <label for="female">Female</label>
             <input type="radio" name="Gender" value="other"/>
             <label for="other" >Other</label>
            </div>


            <div>

                <label for="">Hobby:</label>
                <input type="checkbox" name="hobby" value="Traveling" checked id="traveling"/>
                <label for="traveling">Traveling</label>
                <input type="checkbox" name="hobby" value="Hiking" checked id="Hiking"/>
                <label for="Hiking"> Hiking</label>
                <input type="checkbox" name="hobby" value="Swimming" checked id="Swimming"/>
                <label for="Swimming" >Swimming</label>
            </div>

            <div >
              <label for="Select">Select</label>
              <select name="class" id="Select">
                <option value="B.Sc.CSIT">B.Sc.CSIT</option>
                <option value="BCA">BCA</option>
                <option value="BITM">BITM</option>
                <option value="BBA">BBA</option>
                <option value="BBS">BBS</option>
             </select>

            </div>
            <br>

            
            <div>
                <label for="message" >Message:</label>
                <textarea name="message" id="message" rows="10"></textarea>
            </div>

            <input type="submit" class="submit-button" value="Send Message"/>
        </form>
        
    </body>
</html>
