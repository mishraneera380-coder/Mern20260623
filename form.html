<!DOCTYPE html>
<html>
    <head>
        <title>Form HTML</title>
        <link rel="stylesheet" href="form.css">
        
    </head>
    <body>
        <form action="">
        <center>
            <h1><strong>Form page</strong></h1></center>
            <div>
                <label for="Name" >Name</label>
           <input type="text" id="Name" required placeholder="Your full name">
        
            </div>
            
            <div>
                <label for="Email"> Email </label>
            <input type="email" id="Email" required placeholder="Alex123@gmail.com" requireed
            >

            </div>
            
            
            <div>
                <label for="password">Password</label>
                            <input type="password" id="Password " required>

            </div>
            



            <div>
                <label for="Number ">Number</label>
                            <input type="number" id="Number"  name=Number value="+977">

            </div>
            
            
            <div>
                <label for="Date ">Date</label>
                            <input type="date" id="Date ">


            </div>

            
            <div>

                <label for="time">Time</label>
                                            <input type="time" id="time ">

            </div>
            <p></p>
            Date Time:<input type="date time">

            <br>
            <label for ="file">File</label><br>
            <input type="file" name="file" accept=".jpeg, .png, .pdf, .jpg"><br>

            Color:<input type="color"> 
            Range: <input type="range">
            Female:<input type="radio" name="Gender">
            Male:<input type="radio" name="Gender">
            Others:<input type="radio" name="Gender">
            B.Sc.CSIT:<input type="checkbox" name="Faculty">
            BCA:<input type="checkbox" name="Faculty">
            BBA:<input type="checkbox" name="Faculty">
            
            Select:<select name="" id="">
                <option value="B.sc.CSIT">B.sc.CSIT</option>
                <option value="BCA">BCA</option>
                <option value="BITM">BITM</option>
                <option value="BBA">BBA</option>
                <option value="BBS">BBS</option>
            </select>

            
            <hr>
            <right>Submit: <input type="submit"></right>
            <p>
                text area:<textarea name="" id=""></textarea>
            </p>
        
        </form>


 
        
    </body>
</html>
