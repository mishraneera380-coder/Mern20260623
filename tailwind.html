<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- color:text-(color)-(shade) -->
     <!-- Background color: bg-{color}-{shade} -->
   <h1 class="text-red-900 bg-green-50" >Hello World!</h1>

   <!-- Background gradient:bg-gradient-<direction> from-(color)-(shade) to-{color}-{shade}  -->
   <h2 class="bg-gradient-to-l from-blue-100 to-yellow-300 text-brown ">Learning the basic of the tailwind through it's introduction and working mechanism.</h2>

   <!-- Typography -->
   <!-- Text size :xs, sm, md, lg, xl, 2xl, 3xl, .....9xl-->
   <!-- Font weight: light, medium, semibold, bold -->
   <!-- Text alignment:left, right, center, justify -->
   <!-- letter spacing: tracking-(space) where space=tight,tighter -->
   <!--Line height: leading-(number) where number= none,1,2,3,....8,9  -->
   <!-- Text Decoration: can simply put the name such as underline, linethrough-->


   <p class="text-2xl font-semibold text-justify tracking-tighter leading-9 underline">Learning the concept of the typography in Tailwind CSS.</p>
    
</body>
</html>
